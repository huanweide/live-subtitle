name: CI

# 真门禁：语法 / 编码 / 单元测试 / 引用完整性 / 凭据扫描，任一不过就红。
# 特意用 Windows PowerShell 5.1（不是 pwsh 7）——用户实际跑的就是 5.1，
# 用 7 跑过不代表 5.1 能跑（BOM 那条检查就是 5.1 独有的坑）。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: PowerShell 语法解析 + 编码检查
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path . -Recurse -File -Filter *.ps1 |
                     Where-Object { $_.FullName -notmatch '\\\.git\\' })
          if ($files.Count -eq 0) { throw "没找到任何 .ps1 文件，脚本清单本身就有问题" }

          $bad = 0

          # 1) 语法解析：不执行、只让解析器过一遍，能抓出所有语法错误
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              Write-Host "SYNTAX-BAD  $($f.FullName)"
              $errors | Select-Object -First 3 | ForEach-Object { Write-Host "   $($_.Message)" }
            } else {
              Write-Host "SYNTAX-OK   $($f.FullName)"
            }
          }

          # 2) 编码检查：含中文的 .ps1 必须带 UTF-8 BOM。
          #    Windows PowerShell 5.1 读没有 BOM 的 UTF-8 会按 ANSI 解码，中文全变乱码并直接解析失败。
          foreach ($f in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            $hasNonAscii = $false
            foreach ($b in $bytes) { if ($b -gt 127) { $hasNonAscii = $true; break } }
            if ($hasNonAscii -and -not $hasBom) {
              $bad++
              Write-Host "BOM-MISSING $($f.FullName)  —— 含中文却没有 UTF-8 BOM，PS 5.1 会读成乱码"
            }
          }

          if ($bad -gt 0) { throw "语法/编码检查失败，共 $bad 处" }
          Write-Host "语法与编码检查全部通过（$($files.Count) 个脚本）"

      - name: 跑文字处理单元测试
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File "tests\Invoke-SubtitleTests.ps1"
          if ($LASTEXITCODE -ne 0) { throw "单元测试失败，退出码 $LASTEXITCODE" }
          Write-Host "单元测试全绿"

      - name: 引用完整性检查
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'lib\SubtitleText.ps1')) { throw "lib\SubtitleText.ps1 不存在" }
          # 注意：只查「文件名字符串是否出现」是不够的——配置行里本来就有这个字符串。
          # 必须查真正的 dot-source 语句（形如 ". $script:LibPath"）还在不在。
          $main = Get-Content -Raw -Encoding UTF8 '实时字幕.ps1'
          if ($main -notmatch '(?m)^\s*\.\s+\$script:LibPath') {
            throw "主脚本没有 dot-source lib\SubtitleText.ps1 —— 文字处理会整体失效，而且肉眼看不出来"
          }
          if (-not (Test-Path 'subtitle-glossary.example.json')) { throw "术语表模板 subtitle-glossary.example.json 缺失" }
          Write-Host "引用完整性检查通过"

      - name: 凭据泄露扫描
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # 注意：本文件自身含有这些特征串，所以扫描必须排除 .github 目录，
          # 否则会命中规则文本本身造成自指误报。
          $patterns = @(
            'sk-[A-Za-z0-9]{20,}',
            'ck_[A-Za-z0-9_\.]{10,}',
            'ghp_[A-Za-z0-9]{30,}',
            'xox[baprs]-[A-Za-z0-9-]{10,}',
            'AKIA[0-9A-Z]{16}',
            '-----BEGIN [A-Z ]*PRIVATE KEY-----',
            'SESSDATA=',
            'postgres(ql)?://[^:\s/]+:[^@\s]+@'
          )
          $skipLine = '(你的|your[-_ ]?key|YOUR_|placeholder|示例|占位|xxx|TODO)'
          $exts = @('.ps1','.json','.md','.bat','.vbs','.yml','.yaml','.txt','.config','.xml','.properties','.ini')
          $files = @(Get-ChildItem -Path . -Recurse -File | Where-Object {
            ($exts -contains $_.Extension.ToLower()) -and
            ($_.FullName -notmatch '\\(\.git|\.github)\\')
          })

          $hit = 0
          foreach ($f in $files) {
            $lines = @(Get-Content -LiteralPath $f.FullName -ErrorAction SilentlyContinue)
            for ($i = 0; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              if ($line -match $skipLine) { continue }
              foreach ($p in $patterns) {
                if ($line -match $p) {
                  $hit++
                  Write-Host "CREDENTIAL-HIT $($f.FullName):$($i+1)"
                  break
                }
              }
            }
          }
          if ($hit -gt 0) { throw "扫到 $hit 处疑似真实凭据，禁止合入" }
          Write-Host "凭据扫描通过（扫了 $($files.Count) 个文件，0 命中）"

      - name: 写汇总
        if: always()
        shell: powershell
        run: |
          $line = "live-subtitle CI：语法/编码 + 单元测试(38 断言) + 引用完整性 + 凭据扫描"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line
